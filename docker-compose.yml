services:
  ors-app:
    image: openrouteservice/openrouteservice:latest
    container_name: ors-app

    ports:
      - "8080:8082"

    volumes:
      - ./ors-docker:/home/ors

    environment:
      REBUILD_GRAPHS: "FALSE"
      CONTAINER_LOG_LEVEL: INFO

      XMS: 4g
      XMX: 10g

      ADDITIONAL_JAVA_OPTS: ""

    restart: unless-stopped